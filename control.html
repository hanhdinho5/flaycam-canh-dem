<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Điều khiển Flycam</title>
<style>
  :root{--bg:#0b1218;--card:#131d27;--line:#22313f;--fg:#e6f1f7;--mut:#7f95a6;--acc:#33c6e8;--ok:#3ddc97;--bad:#ff6b6b}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;padding:14px;max-width:1100px;margin:auto}
  h1{font-size:18px;margin:0 0 12px} h2{font-size:14px;margin:18px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,select,button{font:inherit;color:var(--fg);background:#0e161d;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  button{cursor:pointer;background:#173042} button:hover{border-color:var(--acc)} button.primary{background:var(--acc);color:#04222b;border-color:var(--acc);font-weight:600}
  button.danger{background:#3a1b1b}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad);margin-right:6px} .dot.on{background:var(--ok)}
  .cmds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .cmds button{padding:12px;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .gift{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center}
  .gift.assigned{border-color:#2f7f94;background:#10222b}
  .gift img{width:56px;height:56px;object-fit:contain;cursor:pointer;border-radius:8px;transition:transform .1s} .gift img:active{transform:scale(.9)}
  .gift .n{font-size:12px;text-align:center;min-height:30px} .gift select{width:100%;font-size:12px;padding:5px}
  .hint{color:var(--mut);font-size:12px}
  #flash{position:fixed;right:14px;bottom:14px;background:#173042;border:1px solid var(--acc);padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .25s}
  #flash.show{opacity:1}
</style>
</head>
<body>
<h1>🛸 Điều khiển Flycam Đêm Trăng</h1>

<div class="panel">
  <div class="row">
    <span><span class="dot" id="wsDot"></span><span id="wsTxt">Chưa nối server</span></span>
    <span>·</span>
    <span id="modeTxt" class="hint"></span>
  </div>
  <div class="row" style="margin-top:10px">
    <input id="user" placeholder="@username TikTok đang live" size="26">
    <button class="primary" id="btnConnect">Nối live TikTok</button>
    <button id="btnDemo">Chạy demo</button>
    <button class="danger" id="btnStop">Ngắt</button>
    <a id="liveLink" href="/" target="_blank" style="color:var(--acc);margin-left:auto">Mở trang live (9:16) ↗</a>
  </div>
</div>

<h2>Bay thử trực tiếp</h2>
<div class="panel cmds" id="cmds"></div>

<h2>Quà 1 xu → hướng bay <span class="hint" style="text-transform:none">(bấm hình quà để bay thử, chọn hướng ở ô dưới để gán cho live thật)</span></h2>
<div class="row" style="margin-bottom:10px">
  <input id="q" placeholder="Tìm quà..." size="22">
  <label class="hint"><input type="checkbox" id="onlyAssigned" style="vertical-align:middle"> chỉ hiện quà đã gán</label>
  <span class="hint" id="count"></span>
</div>
<div class="grid" id="grid"></div>
<div id="flash"></div>
<script type="module" src="/src/control.ts"></script>
</body>
</html>
